<!-- /var/ossec/etc/ossec.conf - Monitoreo FIM (syscheck) -->

<syscheck>
  <disabled>no</disabled>
  <frequency>43200</frequency>

  <!-- Monitoreo en tiempo real de /etc vía inotify -->
  <directories check_all="yes" realtime="yes">/etc</directories>

  <!-- Reportar diffs de contenido solo en archivos de configuración no sensibles -->
  <directories check_all="yes" report_changes="yes">/etc/issue.net,/etc/hosts,/etc/ssh/sshd_config</directories>

  <!-- SEGURIDAD: Evitar diffs en /etc/shadow para no filtrar hashes de contraseñas al Manager/Dashboard -->
  <nodiff>/etc/shadow</nodiff>

  <!-- Rutas dinámicas ignoradas para evitar alertas ruidosas -->
  <ignore>/etc/mtab</ignore>
  <ignore>/etc/hosts.deny</ignore>
  <ignore>/etc/mail.rc</ignore>
</syscheck>
